[project]
name = "l0w-ops"
version = "0.1.0"
description = "The l0wagent ops containers: install extensions at pinned commits and, with Docker access opted in, update the install"
requires-python = ">=3.12,<3.13"
dependencies = ["l0wproto", "starlette>=0.40", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
l0w-updater = "l0w_ops.updater:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
l0wproto = { path = "../protocol/py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l0w_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 190
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
