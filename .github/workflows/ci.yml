name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  control:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: control } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/export_openapi.py --check

  protocol:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: protocol/py } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python scripts/make_vectors.py --check
      - run: uv run python scripts/make_schemas.py --check
      - run: python3 ../../dev/check-boundaries.py   # instance and hub/ depend only on protocol/

  fake-hub:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dev/hub } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q   # includes the whole conformance suite against the fake hub

  gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .

  tunnel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tunnel } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .

  # The ops container: extension installs (local git repositories), the update request, ops-docker against a fake Docker socket.
  ops:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ops } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .

  # The generic hub on Cloudflare: unit tests (spec vectors), then the whole conformance suite against
  # `wrangler dev` running locally (scripts/conformance.sh starts and stops it).
  hub:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hub } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with: { package_json_file: hub/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: ./scripts/conformance.sh
      # A real instance (control + gateway + tunnel) joins this hub under wrangler dev and is reached through it.
      - run: uv sync --frozen && uv run pytest -q tests/test_hub_join.py -k hub-core
        working-directory: control

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:api
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The M1 flow in a browser, against the real backend (runner + fake claude + egress, no Docker).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: control
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web

  # The isolation checks against the compose stack (sandbox network, egress, guard).
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.dev.yaml up -d --build --wait control egress agent gateway tunnel ops
      - run: dev/isolation-test.sh
      - if: failure()
        run: docker compose -f compose.dev.yaml logs --tail 200
