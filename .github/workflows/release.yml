name: Release
# Multi-arch images on GHCR. A tag vX.Y.Z publishes :X.Y.Z and :stable (plus a GitHub release
# with that version's CHANGELOG section); every push to main publishes :edge.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: control, context: ., file: deploy/control.Dockerfile }
          - { name: agent, context: agent, file: agent/Dockerfile }
          - { name: egress, context: egress, file: egress/Dockerfile }
          - { name: agent-web, context: agent-web, file: agent-web/Dockerfile }
          - { name: chat-runtime, context: chat-runtime, file: chat-runtime/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/cyrusbrown/l0wagent-${{ matrix.name }}:$v,ghcr.io/cyrusbrown/l0wagent-${{ matrix.name }}:stable" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/cyrusbrown/l0wagent-${{ matrix.name }}:edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: L0W_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          v="${GITHUB_REF#refs/tags/v}"
          awk -v v="$v" '$0 ~ "^## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "v$v" --title "l0wagent $v" --notes-file notes.md
        env: { GH_TOKEN: "${{ github.token }}" }
