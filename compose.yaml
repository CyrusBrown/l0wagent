# l0wagent: the release stack, from prebuilt images. Install and update with ./l0w:
#
#   ./l0w install     checks Docker, picks a sandbox subnet, writes .env with fresh tokens,
#                     pulls the images and starts this stack
#   ./l0w update      waits until the assistant is idle, pulls, recreates
#
# Host resources (GPU, memory, extra folders) go in compose.override.yaml, which Compose reads
# automatically; see compose.override.example.yaml. compose.dev.yaml builds from source instead.
#
#   LAN ──:8000 control (web app + API) ──(sandbox net)──▶ agent (runner :8765)
#        :8001 control's files origin (agent-made files, sandboxed)
#   agent ── HTTP(S)_PROXY ──▶ egress ──▶ internet (logged; model access only under a lease)
#   hub:   tunnel ──(hubnet)──▶ control-hub (control's alias on hubnet) and gateway (the keys)
#          tunnel ──(outside)──▶ the hub, dialing out; the agent is never on hubnet
#
# The agent's only network is `sandbox`: internal (no route out) and with no host IP on the
# bridge, so it can't reach the host, the LAN or the internet except through egress.
name: l0wagent

x-tokens: &tokens
  L0W_AGENT_TOKEN: ${L0W_AGENT_TOKEN:?run ./l0w install (it writes .env)}
  L0W_RUNNER_TOKEN: ${L0W_RUNNER_TOKEN:?run ./l0w install}
  L0W_EGRESS_TOKEN: ${L0W_EGRESS_TOKEN:?run ./l0w install}
  L0W_GATEWAY_TOKEN: ${L0W_GATEWAY_TOKEN:?run ./l0w install}

services:
  control:
    image: ghcr.io/cyrusbrown/l0wagent-control:${L0W_VERSION:-stable}
    restart: unless-stopped
    environment:
      <<: *tokens
      L0W_RUNNER_URL: http://agent:8765
      L0W_EGRESS_URL: http://egress-admin:8090
      L0W_SANDBOX_SUBNET: ${SANDBOX_SUBNET:?run ./l0w install}
      L0W_AGENT_HOME: /agent-home
      L0W_CHAT_RUNTIME_URL: http://chat-runtime:8770
      L0W_CHAT_RUNTIME_TOKEN: ${L0W_CHAT_RUNTIME_TOKEN:?run ./l0w install}
      L0W_CHAT_SUBNET: ${CHAT_SUBNET:?run ./l0w install}
      L0W_GATEWAY_URL: http://gateway:8780
      L0W_TUNNEL_SUBNET: ${TUNNEL_SUBNET:?run ./l0w install}
      L0W_FILES_PORT: "8001"
      # The ports the browser uses (published), for links to the files origin.
      L0W_FILES_PUBLIC_PORT: ${L0W_FILES_PUBLISHED_PORT:-8001}
      L0W_INSTANCE_NAME: ${L0W_INSTANCE_NAME:-l0wagent}
      L0W_CHANNEL: ${L0W_CHANNEL:-stable}
      L0W_SECRET_KEY: ${L0W_SECRET_KEY:-}
      # First-run setup code (./l0w install prints it), reverse-proxy addresses to trust, cookie Secure flag.
      L0W_SETUP_CODE: ${L0W_SETUP_CODE:-}
      L0W_TRUSTED_PROXIES: ${L0W_TRUSTED_PROXIES:-}
      L0W_COOKIE_SECURE: ${L0W_COOKIE_SECURE:-auto}
      USAGE_UNKNOWN_POLICY: ${USAGE_UNKNOWN_POLICY:-refuse}
    ports:
      - "${L0W_BIND:-0.0.0.0}:${L0W_PORT:-8000}:8000"
      - "${L0W_BIND:-0.0.0.0}:${L0W_FILES_PUBLISHED_PORT:-8001}:8001"
    volumes:
      - control-data:/data
      - agent-home:/agent-home:ro
      - agent-workspace:/workspace:ro
      - agent-work:/work:ro
      # Control's only write path into the agent's storage: owner uploads into _inbox/.
      - type: volume
        source: agent-work
        target: /work/_inbox
        volume: { subpath: _inbox }
      # The owner's extensions (M8), read-only: control loads them; the agent never sees this folder.
      - ./extensions:/app/extensions:ro
    networks:
      outside: {}
      sandbox: {}
      ctl: {}
      chat: {}
      # The tunnel reaches control as `control-hub`, an alias that exists on hubnet only. Control is on
      # several networks, so the plain name `control` could resolve (and be routed) to an address outside
      # the tunnel subnet; a request arriving from there would dodge the tunnel caller class
      # (L0W_TUNNEL_SUBNET) and be treated as an ordinary LAN or local caller.
      hubnet:
        aliases: [control-hub]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [agent, gateway]

  # `./l0w backup` / `./l0w restore`: encrypted backup of the volumes and the install folder. Not
  # started by `up`; it has no network and reads the archive from stdin / writes it to stdout.
  backup:
    image: ghcr.io/cyrusbrown/l0wagent-control:${L0W_VERSION:-stable}
    profiles: ["tools"]
    entrypoint: ["python", "-m", "l0w_control.backup"]
    network_mode: none
    user: "0:0"
    environment:
      L0W_BACKUP_PASSPHRASE: ${L0W_BACKUP_PASSPHRASE:-}
      L0W_BACKUP_ROOT: /vol
    volumes:
      - control-data:/vol/data
      - egress-data:/vol/egress-data
      - gateway-data:/vol/gateway-data
      - agent-home:/vol/agent-home
      - agent-reviewer:/vol/agent-reviewer
      - agent-workspace:/vol/agent-workspace
      - agent-work:/vol/agent-work
      - ./:/vol/install

  egress:
    image: ghcr.io/cyrusbrown/l0wagent-egress:${L0W_VERSION:-stable}
    restart: unless-stopped
    environment:
      EGRESS_TOKEN: ${L0W_EGRESS_TOKEN}
      SANDBOX_SUBNET: ${SANDBOX_SUBNET}
      CHAT_SUBNET: ${CHAT_SUBNET:?run ./l0w install}
      GATED_HOSTS: api.anthropic.com,opencode.ai
      DEFAULT_POLICY: ${EGRESS_DEFAULT_POLICY:-allow}
      DATA_DIR: /data
    volumes:
      - egress-data:/data
    networks:
      outside: {}
      sandbox: {}
      chat: {}
      ctl:
        aliases: [egress-admin]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  agent:
    image: ghcr.io/cyrusbrown/l0wagent-agent:${L0W_VERSION:-stable}
    restart: unless-stopped
    hostname: sandbox
    environment:
      RUNNER_TOKEN: ${L0W_RUNNER_TOKEN}
      # The runner answers only control (a host name; Docker resolves it on the sandbox network).
      RUNNER_ALLOWED_FROM: control
      AGENT_API_TOKEN: ${L0W_AGENT_TOKEN}
      CONTROL_URL: http://control:8000
      FAKE_CLAUDE: "0"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,control,agent,egress
      no_proxy: localhost,127.0.0.1,control,agent,egress
      NODE_USE_ENV_PROXY: "1"
      ENABLE_CLAUDEAI_MCP_SERVERS: "false"
      GIT_AUTHOR_NAME: Assistant
      GIT_AUTHOR_EMAIL: assistant@sandbox.local
      GIT_COMMITTER_NAME: Assistant
      GIT_COMMITTER_EMAIL: assistant@sandbox.local
      TZ: ${TZ:-UTC}
    volumes:
      - agent-home:/home/agent
      - agent-reviewer:/home/reviewer
      - agent-workspace:/workspace
      - agent-work:/work
      - agent-cache:/cache
    networks: [sandbox]
    cap_drop: [NET_RAW, NET_ADMIN, SYS_PTRACE, SYS_MODULE, SYS_TIME]
    deploy:
      resources:
        limits: { pids: 2048 }  # compose.override.yaml adds memory, CPU and the GPU here
    depends_on: [egress]

  chat-runtime:
    image: ghcr.io/cyrusbrown/l0wagent-chat-runtime:${L0W_VERSION:-stable}
    restart: unless-stopped
    environment:
      CHAT_RUNTIME_TOKEN: ${L0W_CHAT_RUNTIME_TOKEN}
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,control,egress
      no_proxy: localhost,127.0.0.1,control,egress
      NODE_USE_ENV_PROXY: "1"
    networks: [chat]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    depends_on: [egress]

  # The hub (H3): the gateway holds the instance's keys and signs on request; the tunnel dials out to the
  # hub and forwards visitors to control. Both live on hubnet (internal) only, never on the sandbox.
  gateway:
    image: ghcr.io/cyrusbrown/l0wagent-gateway:${L0W_VERSION:-stable}
    restart: unless-stopped
    environment:
      GATEWAY_DATA_DIR: /data
      GATEWAY_PORT: "8780"
      GATEWAY_CONTROL_TOKEN: ${L0W_GATEWAY_TOKEN:?run ./l0w install}
      GATEWAY_TUNNEL_TOKEN: ${L0W_GATEWAY_TUNNEL_TOKEN:?run ./l0w install}
    volumes:
      - gateway-data:/data
    # gateway-out: its own route to the internet (peer delivery, directory fetches; targets vetted like egress).
    # No other container joins it.
    networks: [hubnet, gateway-out]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tunnel:
    image: ghcr.io/cyrusbrown/l0wagent-tunnel:${L0W_VERSION:-stable}
    restart: unless-stopped
    environment:
      TUNNEL_GATEWAY_URL: http://gateway:8780
      TUNNEL_GATEWAY_TOKEN: ${L0W_GATEWAY_TUNNEL_TOKEN:?run ./l0w install}
      # control-hub, not control: see the alias on control's hubnet entry.
      TUNNEL_CONTROL_URL: http://control-hub:8000
      TUNNEL_FILES_URL: http://control-hub:8001
    networks: [hubnet, outside]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [gateway]

networks:
  outside: {}
  gateway-out: {}
  sandbox:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${SANDBOX_SUBNET}
  chat:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${CHAT_SUBNET}
  hubnet:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${TUNNEL_SUBNET:?run ./l0w install}
  ctl:
    internal: true

volumes:
  control-data:
  egress-data:
  gateway-data:
  agent-home:
  agent-reviewer:
  agent-workspace:
  agent-work:
  agent-cache:
