[project]
name = "l0wproto"
version = "0.1.0"
description = "Reference library for the l0wagent hub protocol (l0w/0.1)"
requires-python = ">=3.12"
dependencies = ["cryptography>=42"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.18", "httpx>=0.27", "websockets>=14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l0wproto"]
# Editable installs put these directories on sys.path: src/ for l0wproto, and protocol/ so that
# `python -m conformance` (protocol/conformance/) works from this environment.
dev-mode-dirs = ["src", ".."]

[tool.pytest.ini_options]
testpaths = ["tests"]
