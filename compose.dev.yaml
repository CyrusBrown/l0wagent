# Development stack, built from source. M0: control serves the mock backend and the
# web dev server proxies /api to it. The agent, egress and the fake runner join in M1.
#
#   docker compose -f compose.dev.yaml up --build     → http://localhost:5173
name: l0wagent-dev

services:
  control:
    build: ./control
    environment:
      L0W_BACKEND: mock
      L0W_MOCK_LOGIN: ${L0W_MOCK_LOGIN:-0}   # 1 = require login (any user, password "password")
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/meta')"]
      interval: 5s
      retries: 10

  web:
    image: node:24-slim
    working_dir: /web
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      L0W_API: http://control:8000
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      control: { condition: service_healthy }

volumes:
  web_node_modules:
