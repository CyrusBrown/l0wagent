# Development stack, built from source.
#
#   docker compose -f compose.dev.yaml up --build     → http://localhost:5173 (UI), :8000 (API), :8001 (files origin)
#
# By default the agent runs a fake Claude Code (FAKE_CLAUDE=1) and runs may start without a
# usage reading, so nothing needs a login or spends usage. For the real thing:
#   FAKE_CLAUDE=0 USAGE_UNKNOWN_POLICY=refuse docker compose -f compose.dev.yaml up --build
#   docker compose -f compose.dev.yaml exec -u agent agent claude auth login
# The UI against the in-memory mock instead: L0W_BACKEND=mock (control only).
#
#   LAN ──:5173 web──▶ control ──(sandbox net)──▶ agent (runner :8765)
#                        │  ▲                      │
#                        │  └──── agent API ◀──────┘
#                        └─(ctl net)─▶ egress ◀── HTTP(S)_PROXY ─┘ ──▶ internet
#   LAN ──:8787 agent-web ──(sandbox net)──▶ agent :8787   (inbound only)
#
# The agent's only network is `sandbox`: internal (no route out) and with no host IP on the
# bridge, so it can't reach the host, the LAN or the internet except through egress.
# The tokens below are for development only; the installer (M5) generates real ones.
name: l0wagent-dev

x-tokens: &tokens
  L0W_AGENT_TOKEN: ${L0W_AGENT_TOKEN:-dev-agent-token}
  L0W_RUNNER_TOKEN: ${L0W_RUNNER_TOKEN:-dev-runner-token}
  L0W_EGRESS_TOKEN: ${L0W_EGRESS_TOKEN:-dev-egress-token}

services:
  control:
    build: ./control
    environment:
      <<: *tokens
      L0W_BACKEND: ${L0W_BACKEND:-sqlite}
      L0W_MOCK_LOGIN: ${L0W_MOCK_LOGIN:-0}
      L0W_RUNNER_URL: http://agent:8765
      L0W_EGRESS_URL: http://egress-admin:8090
      L0W_SANDBOX_SUBNET: ${SANDBOX_SUBNET:-172.31.240.0/24}
      L0W_AGENT_HOME: /agent-home
      USAGE_UNKNOWN_POLICY: ${USAGE_UNKNOWN_POLICY:-allow}
      L0W_FILES_PORT: "8001"  # the files origin: agent-made files, never on the UI's origin
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8001:8001"]
    volumes:
      - control-data:/data
      - agent-home:/agent-home:ro
      - agent-workspace:/workspace:ro
      - agent-work:/work:ro
      # Control's only write path into the agent's storage: owner uploads into _inbox/.
      - type: volume
        source: agent-work
        target: /work/_inbox
        volume: { subpath: _inbox }
    networks: [outside, sandbox, ctl]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [agent]  # the agent's image seeds the work volume (with _inbox/) first
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/meta')"]
      interval: 5s
      retries: 10

  egress:
    build: ./egress
    environment:
      EGRESS_TOKEN: ${L0W_EGRESS_TOKEN:-dev-egress-token}
      SANDBOX_SUBNET: ${SANDBOX_SUBNET:-172.31.240.0/24}
      GATED_HOSTS: api.anthropic.com,opencode.ai
      DEFAULT_POLICY: ${EGRESS_DEFAULT_POLICY:-allow}
      DATA_DIR: /data
    volumes:
      - egress-data:/data
    networks:
      outside: {}
      sandbox: {}
      ctl:
        aliases: [egress-admin]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  agent:
    build:
      context: ./agent
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-stable}
    hostname: sandbox
    environment:
      RUNNER_TOKEN: ${L0W_RUNNER_TOKEN:-dev-runner-token}
      AGENT_API_TOKEN: ${L0W_AGENT_TOKEN:-dev-agent-token}
      CONTROL_URL: http://control:8000
      FAKE_CLAUDE: ${FAKE_CLAUDE:-1}
      FAKE_STEPS: ${FAKE_STEPS:-12}
      FAKE_STEP_DELAY: ${FAKE_STEP_DELAY:-3}
      FAKE_CALL_ASSISTANT: "1"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,control,agent,egress
      no_proxy: localhost,127.0.0.1,control,agent,egress
      NODE_USE_ENV_PROXY: "1"
      # The agent logs in with your claude.ai account; don't let it inherit your connectors.
      ENABLE_CLAUDEAI_MCP_SERVERS: "false"
      GIT_AUTHOR_NAME: Assistant
      GIT_AUTHOR_EMAIL: assistant@sandbox.local
      GIT_COMMITTER_NAME: Assistant
      GIT_COMMITTER_EMAIL: assistant@sandbox.local
    volumes:
      - agent-home:/home/agent
      - agent-workspace:/workspace
      - agent-work:/work
      - agent-cache:/cache
    networks: [sandbox]
    cap_drop: [NET_RAW, NET_ADMIN, SYS_PTRACE, SYS_MODULE, SYS_TIME]
    pids_limit: 2048
    depends_on: [egress]

  agent-web:
    build: ./agent-web
    environment:
      TARGET_HOST: agent
      TARGET_PORT: "8787"
    ports: ["127.0.0.1:8787:8787"]
    networks: [outside, sandbox]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [agent]

  web:
    image: node:24-slim
    working_dir: /web
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      L0W_API: http://control:8000
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    ports: ["127.0.0.1:5173:5173"]
    networks: [outside]
    depends_on:
      control: { condition: service_healthy }

networks:
  outside: {}
  sandbox:
    internal: true
    driver: bridge
    driver_opts:
      # No host IP on this bridge, so the agent can't reach services on the host.
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${SANDBOX_SUBNET:-172.31.240.0/24}
  ctl:
    internal: true

volumes:
  control-data:
  egress-data:
  agent-home:
  agent-workspace:
  agent-work:
  agent-cache:
  web_node_modules:
