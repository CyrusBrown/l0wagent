# Development stack, built from source.
#
#   docker compose -f compose.dev.yaml up --build     → http://localhost:5173 (UI), :8000 (API), :8001 (files origin)
#
# By default the agent runs a fake Claude Code (FAKE_CLAUDE=1) and runs may start without a
# usage reading, so nothing needs a login or spends usage. For the real thing:
#   FAKE_CLAUDE=0 USAGE_UNKNOWN_POLICY=refuse docker compose -f compose.dev.yaml up --build
#   docker compose -f compose.dev.yaml exec -u agent agent claude auth login
# The UI against the in-memory mock instead: L0W_BACKEND=mock (control only).
#
#   LAN ──:5173 web──▶ control ──(sandbox net)──▶ agent (runner :8765)
#                        │  ▲                      │
#                        │  └──── agent API ◀──────┘
#                        └─(ctl net)─▶ egress ◀── HTTP(S)_PROXY ─┘ ──▶ internet
#   tunnel ──(hubnet)──▶ control-hub, gateway;  tunnel ──(outside)──▶ the hub (the agent is never on hubnet)
#   control ──(opsnet)──▶ ops ──(ops-out)──▶ git hosts; ops ──(opsnet)──▶ ops-docker (profile ops-docker) ──▶ the Docker socket
#
# The agent's only network is `sandbox`: internal (no route out) and with no host IP on the
# bridge, so it can't reach the host, the LAN or the internet except through egress.
# The tokens below are for development only; the installer (M5) generates real ones.
name: l0wagent-dev

x-tokens: &tokens
  L0W_AGENT_TOKEN: ${L0W_AGENT_TOKEN:-dev-agent-token}
  L0W_RUNNER_TOKEN: ${L0W_RUNNER_TOKEN:-dev-runner-token}
  L0W_EGRESS_TOKEN: ${L0W_EGRESS_TOKEN:-dev-egress-token}
  L0W_GATEWAY_TOKEN: ${L0W_GATEWAY_TOKEN:-dev-gateway-token}

services:
  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    environment:
      <<: *tokens
      L0W_BACKEND: ${L0W_BACKEND:-sqlite}
      L0W_MOCK_LOGIN: ${L0W_MOCK_LOGIN:-0}
      L0W_RUNNER_URL: http://agent:8765
      L0W_EGRESS_URL: http://egress-admin:8090
      L0W_SANDBOX_SUBNET: ${SANDBOX_SUBNET:-172.31.240.0/24}
      L0W_AGENT_HOME: /agent-home
      L0W_CHAT_RUNTIME_URL: http://chat-runtime:8770
      L0W_CHAT_RUNTIME_TOKEN: ${L0W_CHAT_RUNTIME_TOKEN:-dev-chat-runtime-token}
      L0W_CHAT_SUBNET: ${CHAT_SUBNET:-172.31.230.0/24}
      USAGE_UNKNOWN_POLICY: ${USAGE_UNKNOWN_POLICY:-allow}
      L0W_CORS_ORIGINS: http://localhost:5173  # the Vite dev server (the release image allows only the desktop app)
      L0W_GATEWAY_URL: http://gateway:8780
      L0W_TUNNEL_SUBNET: ${TUNNEL_SUBNET:-172.31.220.0/24}
      L0W_FILES_PORT: "8001"  # the files origin: agent-made files, never on the UI's origin
      L0W_OPS_URL: http://ops:8795
      L0W_OPS_TOKEN: ${L0W_OPS_TOKEN:-dev-ops-token}
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8001:8001"]
    volumes:
      - control-data:/data
      - agent-home:/agent-home:ro
      - agent-workspace:/workspace:ro
      - agent-work:/work:ro
      # Control's only write path into the agent's storage: owner uploads into _inbox/.
      - type: volume
        source: agent-work
        target: /work/_inbox
        volume: { subpath: _inbox }
      # The owner's extensions (M8), read-only: control loads them; the agent never sees this folder.
      - ./extensions:/app/extensions:ro
    networks:
      outside: {}
      sandbox: {}
      ctl: {}
      chat: {}
      # Reached by the tunnel as `control-hub`, an alias on hubnet only, so its requests always come
      # from the tunnel subnet (plain `control` could resolve to another network's address).
      hubnet:
        aliases: [control-hub]
      opsnet: {}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [agent, gateway]  # the agent's image seeds the work volume (with _inbox/) first
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/meta')"]
      interval: 5s
      retries: 10

  # `./l0w backup` / `./l0w restore`: encrypted backup of the volumes and the install folder. Not
  # started by `up`; it has no network and reads the archive from stdin / writes it to stdout.
  backup:
    build:
      context: .
      dockerfile: control/Dockerfile
    profiles: ["tools"]
    entrypoint: ["python", "-m", "l0w_control.backup"]
    network_mode: none
    user: "0:0"
    environment:
      L0W_BACKUP_PASSPHRASE: ${L0W_BACKUP_PASSPHRASE:-}
      L0W_BACKUP_ROOT: /vol
    volumes:
      - control-data:/vol/data
      - egress-data:/vol/egress-data
      - gateway-data:/vol/gateway-data
      - agent-home:/vol/agent-home
      - agent-reviewer:/vol/agent-reviewer
      - agent-workspace:/vol/agent-workspace
      - agent-work:/vol/agent-work
      - ./:/vol/install

  egress:
    build: ./egress
    environment:
      EGRESS_TOKEN: ${L0W_EGRESS_TOKEN:-dev-egress-token}
      SANDBOX_SUBNET: ${SANDBOX_SUBNET:-172.31.240.0/24}
      CHAT_SUBNET: ${CHAT_SUBNET:-172.31.230.0/24}
      GATED_HOSTS: api.anthropic.com,opencode.ai
      DEFAULT_POLICY: ${EGRESS_DEFAULT_POLICY:-allow}
      DATA_DIR: /data
    volumes:
      - egress-data:/data
    networks:
      outside: {}
      sandbox: {}
      chat: {}
      ctl:
        aliases: [egress-admin]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  agent:
    build:
      context: ./agent
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-stable}
    hostname: sandbox
    environment:
      RUNNER_TOKEN: ${L0W_RUNNER_TOKEN:-dev-runner-token}
      # The runner answers only control (a host name; Docker resolves it on the sandbox network).
      RUNNER_ALLOWED_FROM: control
      AGENT_API_TOKEN: ${L0W_AGENT_TOKEN:-dev-agent-token}
      CONTROL_URL: http://control:8000
      FAKE_CLAUDE: ${FAKE_CLAUDE:-1}
      FAKE_STEPS: ${FAKE_STEPS:-12}
      FAKE_STEP_DELAY: ${FAKE_STEP_DELAY:-3}
      FAKE_CALL_ASSISTANT: "1"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,control,agent,egress
      no_proxy: localhost,127.0.0.1,control,agent,egress
      NODE_USE_ENV_PROXY: "1"
      # The agent logs in with your claude.ai account; don't let it inherit your connectors.
      ENABLE_CLAUDEAI_MCP_SERVERS: "false"
      GIT_AUTHOR_NAME: Assistant
      GIT_AUTHOR_EMAIL: assistant@sandbox.local
      GIT_COMMITTER_NAME: Assistant
      GIT_COMMITTER_EMAIL: assistant@sandbox.local
    volumes:
      - agent-home:/home/agent
      - agent-reviewer:/home/reviewer
      - agent-workspace:/workspace
      - agent-work:/work
      - agent-cache:/cache
    networks: [sandbox]
    cap_drop: [NET_RAW, NET_ADMIN, SYS_PTRACE, SYS_MODULE, SYS_TIME]
    pids_limit: 2048
    depends_on: [egress]

  chat-runtime:
    build: ./chat-runtime
    environment:
      CHAT_RUNTIME_TOKEN: ${L0W_CHAT_RUNTIME_TOKEN:-dev-chat-runtime-token}
      CLAUDE_BIN: ${CHAT_CLAUDE_BIN:-/opt/fake/fake_claude.py}
      FAKE_STEP_DELAY: "0"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,control,egress
      no_proxy: localhost,127.0.0.1,control,egress
      NODE_USE_ENV_PROXY: "1"
    volumes:
      - ./agent/runner/fake_claude.py:/opt/fake/fake_claude.py:ro
    networks: [chat]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    depends_on: [egress]

  # The hub (H1): the gateway holds the instance's keys and signs on request; the tunnel dials out to the
  # hub and forwards visitors to control. Both live on hubnet (internal) only, never on the sandbox.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_DATA_DIR: /data
      GATEWAY_PORT: "8780"
      GATEWAY_CONTROL_TOKEN: ${L0W_GATEWAY_TOKEN:-dev-gateway-token}
      GATEWAY_TUNNEL_TOKEN: ${L0W_GATEWAY_TUNNEL_TOKEN:-dev-gateway-tunnel-token}
    volumes:
      - gateway-data:/data
    # gateway-out: its own route to the internet (peer delivery, directory fetches; targets vetted like egress).
    # No other container joins it.
    networks: [hubnet, gateway-out]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tunnel:
    build:
      context: .
      dockerfile: tunnel/Dockerfile
    environment:
      TUNNEL_GATEWAY_URL: http://gateway:8780
      TUNNEL_GATEWAY_TOKEN: ${L0W_GATEWAY_TUNNEL_TOKEN:-dev-gateway-tunnel-token}
      # control-hub, not control: see the alias on control's hubnet entry.
      TUNNEL_CONTROL_URL: http://control-hub:8000
      TUNNEL_FILES_URL: http://control-hub:8001
    networks: [hubnet, outside]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [gateway]

  # The ops container (H6), see compose.yaml. ./extensions.toml must exist (touch it) or Docker makes a folder of that name.
  ops:
    build:
      context: .
      dockerfile: ops/Dockerfile
    user: "${L0W_UID:-1000}:${L0W_GID:-1000}"
    environment:
      L0W_OPS_TOKEN: ${L0W_OPS_TOKEN:-dev-ops-token}
      L0W_OPS_DOCKER_TOKEN: ${L0W_OPS_DOCKER_TOKEN:-dev-ops-docker-token}
      L0W_VERSION: ${L0W_VERSION:-edge}
      L0W_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      OPS_DOCKER_URL: http://ops-docker:8796
      HOME: /tmp
    volumes:
      - ./extensions:/extensions
      - ./extensions.toml:/project/extensions.toml:ro
    networks: [opsnet, ops-out]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256

  # Opt-in: COMPOSE_PROFILES=ops-docker. The only container with the Docker socket; see compose.yaml.
  ops-docker:
    build:
      context: .
      dockerfile: ops/Dockerfile
    profiles: ["ops-docker"]
    command: ["python", "-m", "l0w_ops.docker"]
    user: "0:0"
    environment:
      L0W_OPS_DOCKER_TOKEN: ${L0W_OPS_DOCKER_TOKEN:-dev-ops-docker-token}
      HOME: /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [opsnet]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8796/healthz')"]
      interval: 10s
      retries: 10

  web:
    image: node:24-slim
    working_dir: /web
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      L0W_API: http://control:8000
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    ports: ["127.0.0.1:5173:5173"]
    networks: [outside]
    depends_on:
      control: { condition: service_healthy }

networks:
  outside: {}
  gateway-out: {}
  ops-out: {}
  opsnet:
    internal: true
  sandbox:
    internal: true
    driver: bridge
    driver_opts:
      # No host IP on this bridge, so the agent can't reach services on the host.
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${SANDBOX_SUBNET:-172.31.240.0/24}
  chat:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${CHAT_SUBNET:-172.31.230.0/24}
  hubnet:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${TUNNEL_SUBNET:-172.31.220.0/24}
  ctl:
    internal: true

volumes:
  control-data:
  egress-data:
  gateway-data:
  agent-home:
  agent-reviewer:
  agent-workspace:
  agent-work:
  agent-cache:
  web_node_modules:
