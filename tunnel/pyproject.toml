[project]
name = "l0w-tunnel"
version = "0.1.0"
description = "The instance's hub tunnel client: dials out to the hub and forwards visitors' requests to control and the files app"
requires-python = ">=3.12,<3.13"
dependencies = ["l0wproto", "websockets>=14", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "fakehub", "starlette>=0.40", "uvicorn>=0.30"]

[tool.uv.sources]
l0wproto = { path = "../protocol/py", editable = true }
# tests only: the fake hub. Never imported by l0w_tunnel.
fakehub = { path = "../dev/hub", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l0w_tunnel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../protocol"]

[tool.ruff]
line-length = 190
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
