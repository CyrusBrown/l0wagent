[project]
name = "l0w-control"
version = "0.0.1"
description = "l0wagent control: the trusted server (UI, API, scheduler, vault, gateway)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",
  "argon2-cffi>=25.1.0",
  "httpx>=0.28.1",
  "segno>=1.6.6",
  "cryptography>=50.0.2",
  "dulwich>=1.2.21",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l0w_control"]

[tool.hatch.build.targets.wheel.force-include]
"l0w_control/db/migrations" = "l0w_control/db/migrations"
"l0w_control/prompts" = "l0w_control/prompts"

[tool.ruff]
line-length = 190
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E701", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"l0w_control/mock/fixtures.py" = ["E501"]
"l0w_control/backends/base.py" = ["E501"]
