name = "echo"
title = "Echo"
version = "0.1.0"
sdk = "1.1"
description = "Calls the hub's test service `echo` and keeps the events it sends."
entry = "extension.py"
folders = ["events"]           # /external/echo/events/ for the agent: one file per event echo sent
